name: SELEXIONES Android Build

on:
  push:
    branches:
      - claude/selexiones-app-bow2gf
    paths:
      - 'selexiones-app/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selexiones-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Unsigned debug build — installable for testing, not store-submittable.
      # Once a Play Console account + release keystore exist, add a signed
      # `assembleRelease` / `bundleRelease` job using secrets for the keystore.
      - name: Build debug APK
        working-directory: selexiones-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selexiones-debug-apk
          path: selexiones-app/android/app/build/outputs/apk/debug/app-debug.apk
