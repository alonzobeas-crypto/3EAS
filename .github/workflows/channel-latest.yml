# Daily: keep the newest upload from each listed YouTube channel in SIGNAL FEED (/feed/).
# One entry per channel; a new upload replaces the previous one. Add a channel by adding a
# line to the "Update" step. Also runnable by hand from the Actions tab.
name: Channel latest -> SIGNAL FEED

on:
  schedule:
    - cron: '37 18 * * *'   # daily, ~10:37 PT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-feed-bots     # never write videos.json at the same time as another feed bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update
        run: |
          node scripts/channel-latest.mjs bobbyowsinskimedia bobby "BOBBY OWSINSKI"
      - name: Publish if changed
        run: |
          if git diff --quiet -- feed/videos.json; then echo "no change"; exit 0; fi
          git config user.name  "signal-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/videos.json
          git commit -m "SIGNAL FEED: latest channel uploads (auto)"
          git pull --rebase origin main
          git push
