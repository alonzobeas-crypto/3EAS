<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SELEXIONES</title>
<meta name="description" content="SELEXIONES — Latin & LA-rooted underground radio. Dos canales, una frecuencia.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SELEXIONES">
<meta property="og:title" content="SELEXIONES">
<meta property="og:description" content="Latin & LA-rooted underground radio broadcasting on two channels: UNO / DOS.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:        #07040d;
  --bg2:       #0e0817;
  --card:      linear-gradient(160deg, rgba(46,22,64,.5), rgba(14,8,22,.5));
  --lavender:  #cdc0e6;
  --dim:       #6e6280;
  --fg:        #f4eefb;
  --pink:      #ff4fa6;
  --pink-dim:  rgba(255,79,166,0.35);
  --purple:    #9a5bff;
  --purple-dim:rgba(154,91,255,0.35);
  --border:    rgba(255,255,255,0.10);
  --serif:     'Playfair Display', serif;
  --mono:      'Share Tech Mono', monospace;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  position:relative;
  font-size:15px;
}

/* ── cosmic backdrop ── */
.nebula{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.nebula.n1{width:380px;height:380px;background:var(--pink);opacity:.22;top:-140px;left:-120px}
.nebula.n2{width:340px;height:340px;background:var(--purple);opacity:.22;bottom:8%;right:-140px}
.nebula.n3{width:280px;height:280px;background:var(--purple);opacity:.14;top:45%;left:-150px}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.stars i{position:absolute;border-radius:50%;display:block;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:var(--o,.6)}50%{opacity:calc(var(--o,.6) * .25)}}

.wrap{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:0 16px 50px}

/* ── header: email / subscribe / donate ── */
header.top{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  background:rgba(7,4,13,.78);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.subForm{display:flex;gap:8px;flex:1 1 auto}
.emailInput{
  background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--fg);
  font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:10px 12px;
  min-width:0;flex:1 1 120px;border-radius:3px;
}
.emailInput::placeholder{color:var(--dim)}
.emailInput:focus{outline:none;border-color:var(--pink-dim)}
.subBtn{
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.28);color:var(--fg);
  font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:10px 14px;
  cursor:pointer;white-space:nowrap;border-radius:3px;transition:border-color .2s;
}
.subBtn:hover{border-color:var(--pink)}
.donateBtn{
  background:linear-gradient(135deg,#ff62b0,#ff2f8f);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:2px;padding:10px 16px;
  cursor:pointer;white-space:nowrap;border-radius:3px;text-decoration:none;display:inline-flex;
  align-items:center;gap:6px;box-shadow:0 0 16px rgba(255,64,150,.5);
}

main{position:relative;z-index:2}

/* ── channel card ── */
.chcard{
  margin-top:24px;border:1px solid var(--ch-border);background:var(--card);
  padding:22px 18px;position:relative;overflow:hidden;
}
.chcard.uno{--ch:var(--pink);--ch-dim:var(--pink-dim);--ch-border:rgba(255,79,166,.28)}
.chcard.dos{--ch:var(--purple);--ch-dim:var(--purple-dim);--ch-border:rgba(154,91,255,.28)}
.chcard .chname{
  font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:4px;color:var(--ch);
  display:flex;align-items:center;gap:10px;
}
.chcard .chname .dot{width:9px;height:9px;border-radius:50%;background:var(--ch);box-shadow:0 0 8px var(--ch)}
.chcard .track{
  margin:14px 0 20px;font-family:var(--mono);font-size:13px;letter-spacing:.5px;line-height:1.6;
  color:var(--lavender);text-transform:uppercase;
}
.chcard .controls{display:flex;align-items:center;gap:14px}
.playbtn{
  width:56px;height:56px;border-radius:50%;border:1.5px solid var(--ch);background:none;
  color:var(--ch);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.playbtn:active{background:var(--ch-dim)}
.dots{display:inline-flex;gap:4px;flex:0 0 auto}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--dim);display:block;transition:background .2s}
.dots.on i{background:var(--ch);animation:dotpulse 1.1s ease-in-out infinite}
.dots i:nth-child(1){animation-delay:0s}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
.dots i:nth-child(4){animation-delay:.45s}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}

.slider-wrap{position:relative;flex:1;height:22px;display:flex;align-items:center}
.slider-track{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.15);border-radius:2px}
.slider-fill{position:absolute;left:0;height:3px;background:var(--ch);border-radius:2px;box-shadow:0 0 6px var(--ch)}
.slider-wrap input[type=range]{
  position:relative;width:100%;height:22px;background:transparent;
  -webkit-appearance:none;appearance:none;margin:0;z-index:2;
}
.slider-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ch);
  box-shadow:0 0 8px var(--ch);cursor:pointer;
}
.slider-wrap input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--ch);border:none;
  box-shadow:0 0 8px var(--ch);cursor:pointer;
}
.slider-wrap input[type=range]::-webkit-slider-runnable-track{height:3px;background:transparent}
.slider-wrap input[type=range]::-moz-range-track{height:3px;background:transparent}

.offair-msg{
  margin-top:14px;padding:9px 10px;border:1px dashed var(--ch-border);font-size:10.5px;
  color:var(--dim);letter-spacing:.2px;line-height:1.55;display:none;
}
.offair-msg.show{display:block}

/* ── brand mark ── */
.brandmark{text-align:center;margin:48px 0 8px}
.brandmark h1{
  font-family:var(--serif);font-weight:900;font-size:clamp(38px,12vw,54px);letter-spacing:2px;
  background:linear-gradient(180deg,var(--fg) 20%,var(--pink) 140%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 28px var(--pink-dim);
}
.brandmark .rule{width:64px;height:2px;margin:14px auto 0;
  background:linear-gradient(90deg,transparent,var(--pink),transparent);
}

/* ── lower sections ── */
.section{margin-top:44px}
.section h2{
  font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--fg);text-transform:uppercase;
  padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:14px;
}
.section h2 .tag{color:var(--pink);margin-right:8px}

.bio-text{
  font-family:var(--mono);font-size:12.5px;line-height:1.75;color:var(--lavender);letter-spacing:.2px;
}

.log{display:flex;flex-direction:column;gap:8px}
.log a{
  display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--fg);
  padding:11px 0;border-bottom:1px solid var(--border);font-size:12.5px;transition:color .15s;
}
.log a:hover{color:var(--pink)}
.log .larr{color:var(--dim)}
.log a:hover .larr{color:var(--pink)}

footer{margin-top:44px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center}
footer .nodes{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
footer .nodes a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--dim)}
footer .nodes a:hover{color:var(--pink)}
footer .fine{margin-top:8px;font-size:9px;color:var(--dim);letter-spacing:.5px}
</style>
</head>
<body>
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>
<div class="stars" id="stars"></div>

<header class="top">
  <form class="subForm" action="https://buttondown.com/api/emails/embed-subscribe/selexiones" method="post" target="popupwindow" onsubmit="window.open('https://buttondown.com/selexiones','popupwindow')">
    <input class="emailInput" type="email" name="email" placeholder="EMAIL" required>
    <input class="subBtn" type="submit" value="SUBSCRIBE">
  </form>
  <a class="donateBtn" id="donateBtn" href="#" target="_blank" rel="noopener">DONATE ♥</a>
</header>

<main class="wrap">
  <div class="chcard uno">
    <div class="chname"><span class="dot"></span>UNO</div>
    <div class="track" id="trackUno">—</div>
    <div class="controls">
      <button class="playbtn" id="playUno" onclick="togglePlay('UNO')" aria-label="Play UNO"></button>
      <span class="dots" id="dotsUno"><i></i><i></i><i></i><i></i></span>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="fillUno" style="width:80%"></div>
        <input type="range" id="volUno" min="0" max="100" value="80" oninput="setVolume('UNO',this.value)">
      </div>
    </div>
    <div class="offair-msg" id="offairUno"></div>
  </div>

  <div class="chcard dos">
    <div class="chname"><span class="dot"></span>DOS</div>
    <div class="track" id="trackDos">—</div>
    <div class="controls">
      <button class="playbtn" id="playDos" onclick="togglePlay('DOS')" aria-label="Play DOS"></button>
      <span class="dots" id="dotsDos"><i></i><i></i><i></i><i></i></span>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="fillDos" style="width:80%"></div>
        <input type="range" id="volDos" min="0" max="100" value="80" oninput="setVolume('DOS',this.value)">
      </div>
    </div>
    <div class="offair-msg" id="offairDos"></div>
  </div>

  <div class="brandmark">
    <h1>SELEXIONES</h1>
    <div class="rule"></div>
  </div>

  <section class="section">
    <h2><span class="tag">//</span>BIO</h2>
    <p class="bio-text" id="bioText"></p>
  </section>

  <section class="section">
    <h2><span class="tag">//</span>ARCHIVE</h2>
    <div class="log">
      <a href="https://www.mixcloud.com/SELEXIONES/" target="_blank" rel="noopener">MIXCLOUD ARCHIVE <span class="larr">→</span></a>
      <a href="https://selexiones.com" target="_blank" rel="noopener">SELEXIONES.COM <span class="larr">→</span></a>
    </div>
  </section>

  <footer>
    <div class="nodes">CONNECTED: <a href="https://3eascortex.com" target="_blank" rel="noopener">3EAS</a> // <a href="https://www.onnoticemusic.com/" target="_blank" rel="noopener">ON/NOTICE</a></div>
    <div class="fine">LOS ANGELES · TWO FREQUENCIES</div>
  </footer>
</main>

<script>
/* ──────────────────────────────────────────────────────────────
   CONFIG — single source of truth. Swap placeholders for real
   stream URLs / bio copy / donate link and the UI updates itself.
   ────────────────────────────────────────────────────────────── */
const CONFIG = {
  channels: {
    UNO: {
      streamUrl: 'https://stream.selexiones.com/listen/uno/radio.mp3',
      nowPlayingUrl: 'https://stream.selexiones.com/api/nowplaying/uno',
    },
    DOS: {
      streamUrl: 'https://stream.selexiones.com/listen/dos/radio.mp3',
      nowPlayingUrl: 'https://stream.selexiones.com/api/nowplaying/dos',
    },
  },
  bio: 'SELEXIONES is Latin & LA-rooted underground radio — two channels, one frequency. UNO carries the roots: cumbia, salsa dura, boogaloo, the barrio archive. DOS carries the club: reggaeton perreo, guaracha, baile, the sound of right now. No algorithm. No filler. Selección tras selección.',
  links: {
    donate: 'https://ko-fi.com/selexiones',
    mixcloud: 'https://www.mixcloud.com/SELEXIONES/',
  },
  nowPlayingPollMs: 17000, // matches selexiones.com's own polling cadence
};

const OFFAIR_MSG = 'Signal temporarily unavailable — <a href="' + CONFIG.links.mixcloud + '" target="_blank" rel="noopener">listen to the archive on Mixcloud →</a>';

const PLAY_ICON = '<svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const PAUSE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>';

const players = {
  UNO: { audio: new Audio(), playing: false },
  DOS: { audio: new Audio(), playing: false },
};
Object.values(players).forEach(p => { p.audio.preload = 'none'; });

function renderStatic(){
  document.getElementById('trackUno').textContent = 'CONNECTING…';
  document.getElementById('trackDos').textContent = 'CONNECTING…';
  document.getElementById('playUno').innerHTML = PLAY_ICON;
  document.getElementById('playDos').innerHTML = PLAY_ICON;
  document.getElementById('offairUno').innerHTML = OFFAIR_MSG;
  document.getElementById('offairDos').innerHTML = OFFAIR_MSG;
  document.getElementById('offairUno').classList.toggle('show', !CONFIG.channels.UNO.streamUrl);
  document.getElementById('offairDos').classList.toggle('show', !CONFIG.channels.DOS.streamUrl);

  document.getElementById('bioText').textContent = CONFIG.bio;

  const donateBtn = document.getElementById('donateBtn');
  // Hide donate on iOS — Apple's external-payment-link rules make an outbound
  // ko-fi button on this button's own screen a real App Review risk. Android
  // and the plain web build are unaffected.
  const isIOS = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios';
  if(isIOS){
    donateBtn.style.display = 'none';
  } else if(CONFIG.links.donate){
    donateBtn.href = CONFIG.links.donate;
  } else {
    donateBtn.removeAttribute('href');
    donateBtn.style.cursor = 'pointer';
    donateBtn.addEventListener('click', e => { e.preventDefault(); alert('Donate link not configured yet — set CONFIG.links.donate.'); });
  }

  // Belt-and-suspenders: on native platforms the HTML5 <audio> elements are
  // never intentionally used (togglePlay routes to the native plugin), but
  // make sure they're truly inert so nothing can ever double up audio output.
  if(nativePlugin()){
    Object.values(players).forEach(p => {
      p.audio.pause();
      p.audio.removeAttribute('src');
      p.audio.load();
    });
  }
}

// Inside the native app shell (Capacitor), playback is handed off to a real
// native player (AVPlayer / MediaPlayer) via the RadioPlayer plugin — that's
// what makes the stream survive backgrounding and shows lock-screen controls,
// which a WebView <audio> element cannot do. In a plain browser tab,
// window.Capacitor is undefined and everything falls back to HTML5 Audio.
function nativePlugin(){
  return window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
    ? window.Capacitor.Plugins.RadioPlayer
    : null;
}
let nativeActiveCh = null;

function togglePlay(ch){
  const c = CONFIG.channels[ch];
  const p = players[ch];
  if(!c.streamUrl){
    document.getElementById('offair' + cap(ch)).classList.add('show');
    return;
  }

  const plugin = nativePlugin();
  if(plugin){
    if(nativeActiveCh === ch && p.playing){
      // Pause only — keep the native session alive so resuming is instant
      // and the lock-screen controls don't disappear mid-pause.
      plugin.pause();
      markPaused(ch);
      return;
    }
    if(nativeActiveCh && nativeActiveCh !== ch) stopAudio(nativeActiveCh);
    nativeActiveCh = ch;
    plugin.play({
      url: c.streamUrl,
      title: 'SELEXIONES ' + ch,
      subtitle: document.getElementById('track' + cap(ch)).textContent,
      nowPlayingUrl: c.nowPlayingUrl,
    }).then(() => onPlayStart(ch)).catch(() => onPlayError(ch));
    return;
  }

  if(p.playing){
    stopAudio(ch);
  } else {
    if(p.audio.src !== c.streamUrl) p.audio.src = c.streamUrl;
    p.audio.play().then(() => onPlayStart(ch)).catch(() => onPlayError(ch));
  }
}

function onPlayStart(ch){
  players[ch].playing = true;
  document.getElementById('play' + cap(ch)).innerHTML = PAUSE_ICON;
  document.getElementById('dots' + cap(ch)).classList.add('on');
}

function markPaused(ch){
  players[ch].playing = false;
  document.getElementById('play' + cap(ch)).innerHTML = PLAY_ICON;
  document.getElementById('dots' + cap(ch)).classList.remove('on');
}

// Full stop: tears down the native session (channel switch, off-air error).
// Pausing the still-active channel goes through markPaused() instead.
function stopAudio(ch){
  const plugin = nativePlugin();
  if(plugin && nativeActiveCh === ch){
    plugin.stop();
    nativeActiveCh = null;
  } else if(!plugin){
    players[ch].audio.pause();
  }
  markPaused(ch);
}

function onPlayError(ch){
  stopAudio(ch);
  document.getElementById('offair' + cap(ch)).classList.add('show');
}

function setVolume(ch, v){
  const plugin = nativePlugin();
  if(plugin) plugin.setVolume({ value: v / 100 });
  else players[ch].audio.volume = v / 100;
  document.getElementById('fill' + cap(ch)).style.width = v + '%';
}

// Keep the UI in sync when playback is toggled from outside the page —
// the lock screen / notification media controls — and when the native
// plugin's own now-playing poller (which keeps running while backgrounded,
// unlike a JS setInterval) reports a track change.
(function watchNativePlaybackStatus(){
  const plugin = nativePlugin();
  if(!plugin) return;
  plugin.addListener('playbackStatus', ({ playing }) => {
    if(!nativeActiveCh) return;
    // Lock-screen/notification controls only toggle play/pause, never a
    // full stop, so mirror that here — markPaused, not stopAudio.
    if(playing) onPlayStart(nativeActiveCh);
    else markPaused(nativeActiveCh);
  });
  plugin.addListener('nowPlaying', ({ text }) => {
    if(!nativeActiveCh || !text) return;
    document.getElementById('track' + cap(nativeActiveCh)).textContent = text.toUpperCase();
  });
})();

function cap(ch){ return ch.charAt(0) + ch.slice(1).toLowerCase(); }

['UNO','DOS'].forEach(ch => {
  players[ch].audio.addEventListener('stalled', () => onPlayError(ch));
  players[ch].audio.addEventListener('error', () => onPlayError(ch));
});

async function fetchNowPlaying(ch){
  const url = CONFIG.channels[ch].nowPlayingUrl;
  if(!url) return;
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const song = data && data.now_playing && data.now_playing.song;
    if(song && song.text) document.getElementById('track' + cap(ch)).textContent = song.text.toUpperCase();
  }catch(e){
    // leave the last-known title in place — a missed poll isn't worth alarming over
  }
}

function pollNowPlaying(){
  fetchNowPlaying('UNO');
  fetchNowPlaying('DOS');
}

function buildStars(){
  const wrap = document.getElementById('stars');
  const colors = ['#ffffff', '#ffd6ec', '#d9c6ff'];
  let html = '';
  for(let i = 0; i < 70; i++){
    const top = Math.random() * 100;
    const left = Math.random() * 100;
    const size = (Math.random() * 1.6 + 0.6).toFixed(1);
    const o = (Math.random() * 0.5 + 0.3).toFixed(2);
    const dur = (Math.random() * 3 + 2).toFixed(1);
    const delay = (Math.random() * 4).toFixed(1);
    const color = colors[Math.floor(Math.random() * colors.length)];
    html += `<i style="top:${top}%;left:${left}%;width:${size}px;height:${size}px;background:${color};--o:${o};animation-duration:${dur}s;animation-delay:${delay}s"></i>`;
  }
  wrap.innerHTML = html;
}

renderStatic();
buildStars();

// On native platforms the RadioPlayer plugin polls now-playing itself (per
// the active channel, and it keeps running while backgrounded) — the JS
// poller here is the web-build-only fallback.
if(!nativePlugin()){
  pollNowPlaying();
  setInterval(pollNowPlaying, CONFIG.nowPlayingPollMs);
}
</script>
</body>
</html>
